name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - name: Fetch pyatv sources for the fake Apple TV
        run: |
          pip download --no-deps --no-binary :all: "pyatv==$(pip show pyatv | sed -n 's/^Version: //p')" -d /tmp/pyatv
          tar xzf /tmp/pyatv/pyatv-*.tar.gz -C /tmp/pyatv
          echo "PYATV_SRC=$(ls -d /tmp/pyatv/pyatv-*/)" >> "$GITHUB_ENV"
      - run: pytest -q

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r packaging/requirements-build.txt pytest pytest-asyncio
      - run: pip install --no-deps -e .
      - run: pytest -q tests/test_ffmpeg.py tests/test_hls_server.py tests/test_patch.py
      - run: .\packaging\build_exe.ps1
        shell: pwsh
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $out = & .\dist\AirCast.exe --version | Out-String
          Write-Host $out
          if ($out -notmatch "AirCast") { throw "AirCast.exe --version printed nothing" }
      - uses: actions/upload-artifact@v4
        with:
          name: AirCast-windows
          path: dist/AirCast.exe
