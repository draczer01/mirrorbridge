[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorbridge"
version = "0.3.0"
description = "Cast your Windows screen and audio to Apple TV and other AirPlay TVs (LG, Samsung, TCL...)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyatv==0.18.0",  # airplay_patch.py, airplay_queue.py and mirror/ take over parts of pyatv 0.18.0
    "srptools>=1.0,<2",  # srptools 2.0 breaks pyatv PIN pairing (keyword-only arg)
    "aiohttp>=3.9",
    "mss>=9",
    "numpy>=1.26",
    "soundcard>=0.4.3; sys_platform == 'win32'",
    "PySide6-Essentials>=6.6",
    "imageio-ffmpeg>=0.6; sys_platform == 'win32'",  # FFmpeg 7.1 with ddagrab and GPU encoders (the exe has 8.1.1)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6", "pytest-xdist>=3"]  # pyyaml: the tests read the workflows; xdist: pytest -n auto
build = ["pyinstaller>=6", "imageio-ffmpeg>=0.6"]

[project.scripts]
mirrorbridge = "mirrorbridge.cli:main"

[project.gui-scripts]
mirrorbridge-gui = "mirrorbridge.gui.app:run_gui"

[tool.setuptools.packages.find]
include = ["mirrorbridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test still running after 2 minutes prints where every thread is, so a hang shows its place.
faulthandler_timeout = 120
